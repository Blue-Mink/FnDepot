# ---- global-radio 加速缓存 locations（FPK 1.2.7 注入 server{} 内，勿手改）----
# /rb/      : radio-browser API 中转，10 分钟缓存 + stale 降级（顺带免六镜像探测）
# /imgproxy/: 跨域封面图中转，30 天磁盘缓存 + 浏览器 30 天 HTTP 缓存（双级命中）
location /rb/ {
    proxy_pass https://de1.api.radio-browser.info/;
    proxy_ssl_server_name on;
    proxy_set_header Host de1.api.radio-browser.info;
    proxy_set_header User-Agent "global-radio-fpk/1.2";
    proxy_connect_timeout 8s;
    proxy_read_timeout 20s;
    proxy_cache graccel_api;
    proxy_cache_key "$scheme$request_method$request_uri";
    proxy_cache_valid 200 10m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    expires 60s;
    add_header X-GR-Accel "api" always;
}

# URL 形态：/imgproxy/<encodeURIComponent(原始URL)>
# 注意：nginx URI 解析会把连续 // 折叠成 /（https:// → https:/），
# 因此分开捕获 scheme 与 rest，再拼回标准 ://
location ~ "^/imgproxy/(?<gscheme>https?):/(?<grest>.+)$" {
    resolver __GRRESOLVER__ valid=300s ipv6=off;
    resolver_timeout 5s;
    set $gt "${gscheme}://${grest}";
    if ($gt !~ "^https?://") { set $gt ""; }
    if ($gt ~ "^https?://(?:[^@/]*@)?(?:10\.|127\.|192\.168\.|169\.254\.|172\.(?:1[6-9]|2[0-9]|3[01])\.|100\.(?:6[4-9]|7[0-9]|8[0-9]|9[0-9]|1[01][0-9]|12[0-7])\.|\[)") { set $gt ""; }
    if ($gt ~ "^https?://0\.0\.0\.0(?:[/:?#]|$)") { set $gt ""; }
    if ($gt ~ "^https?://(?:[^@/]*@)?(?:localhost|[^/]*\.(?:local|localdomain|internal|intranet|lan))(?::[0-9]+)?(?:[/?#]|$)") { set $gt ""; }
    if ($gt = "") { return 403; }
    proxy_pass $gt;
    proxy_ssl_server_name on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 12s;
    proxy_set_header Referer "";
    proxy_cache graccel_img;
    proxy_cache_key "$gt";
    proxy_cache_valid 200 30d;
    proxy_cache_valid 403 404 502 503 504 2m;
    proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    expires 30d;
    add_header X-GR-Accel "img" always;
}
