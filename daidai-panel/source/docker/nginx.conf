server {
    listen 5700;
    server_name _;

    root /app/web;
    index index.html;

    gzip on;
    # "font/ttf" 是给 Monaco 的图标字体 codicon-<hash>.ttf 加的：ttf 是未压缩的 sfnt 容器，
    # gzip 能把它从约 137 KiB 压到约 67 KiB，是这份产物里少数还压得动的二进制。
    # 反过来 woff2 刻意不列进来：它自带 Brotli 压缩，再 gzip 一遍纯属白烧 CPU，
    # 理由和下面那条「别加 image/webp」完全一样。
    # 注意：这条能不能命中取决于基础镜像的 mime.types 有没有把 .ttf 映射成 font/ttf。
    # 没映射上时的表现同样是【静默不压缩】而非报错，排查时先看响应头的 Content-Type，
    # 按实际值补一条即可，不要以为 gzip 开了就一定生效。
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml font/ttf;
    gzip_min_length 1024;
    gzip_vary on;

    client_max_body_size 512m;

    # 禁止搜索引擎收录，防止面板地址被公开索引
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 任务日志、订阅拉取等用 SSE 推送，需要长连接 + 不缓冲。
    # 单独放在 /api/ 之前，专门拉高 read_timeout、关闭 chunked buffering。
    location ~* ^/api/.*/stream$ {
        proxy_pass http://127.0.0.1:5701;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # API 路由必须优先于后面的静态资源正则，否则 /api/.../*.jpg 会被当成前端静态文件直接 404。
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5701/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # "webp" 是面板图标 favicon-512.webp 需要的；"ttf" 是 Monaco 的图标字体
    # codicon-<hash>.ttf 需要的（约 137 KiB，本仓第一个 .ttf 产物）。
    # 漏掉任何一个扩展名都不会 404（上面的 try_files 照样命中文件），只是静默丢掉
    # expires/immutable —— 该资源每次加载都要回源重新校验，既没有报错也不会在
    # Console 里留下任何痕迹，只能靠盯响应头发现，所以扩展名必须跟着产物一起维护。
    # 注意别往上面的 gzip_types 加 image/webp：webp 本身已压缩，再 gzip 纯属白烧 CPU。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
